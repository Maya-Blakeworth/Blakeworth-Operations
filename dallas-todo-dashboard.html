<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blakeworth — Weekly Operations Review</title>
    <style>
        :root {
            --primary-light: #4A90E2;
            --primary-dark: #357ABD;
            --accent: #72C4E8;
            --success: #27AE60;
            --hold: #F39C12;
            --reject: #E74C3C;
            --bg-light: #FFFFFF;
            --bg-secondary-light: #F5F8FB;
            --text-light: #2C3E50;
            --border-light: #D5E0EA;
            --stuck-red: #DC2626;
            --pending-yellow: #EAB308;
            --inprogress-orange: #EA580C;
            --new-blue: #2563EB;
            
            --bg-dark: #1A1F2E;
            --bg-secondary-dark: #242A3A;
            --text-dark: #E0E6ED;
            --border-dark: #3F4654;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-light);
            color: var(--text-light);
            transition: background 0.3s ease, color 0.3s ease;
            padding: 24px 20px;
            line-height: 1.6;
        }
        body.dark-mode {
            background: var(--bg-dark);
            color: var(--text-dark);
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 2px solid var(--border-light);
        }
        body.dark-mode header {
            border-bottom-color: var(--border-dark);
        }
        .header-left h1 {
            font-size: 32px;
            color: var(--primary-light);
            margin-bottom: 4px;
            font-weight: 700;
        }
        .header-left p {
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 8px;
        }
        .header-meta {
            font-size: 12px;
            color: var(--primary-light);
            font-weight: 600;
            opacity: 0.8;
        }
        .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .toggle-btn {
            background: var(--bg-secondary-light);
            color: var(--text-light);
            border: 1px solid var(--border-light);
        }
        body.dark-mode .toggle-btn {
            background: var(--bg-secondary-dark);
            color: var(--text-dark);
            border-color: var(--border-dark);
        }
        .export-btn {
            background: var(--primary-light);
            color: white;
        }
        .export-btn:hover {
            background: var(--primary-dark);
        }
        .guidance {
            background: var(--accent);
            color: white;
            padding: 14px 16px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 28px;
            line-height: 1.5;
            display: flex;
            gap: 12px;
        }
        .guidance-icon {
            font-size: 18px;
            flex-shrink: 0;
        }
        .wins-section {
            margin-bottom: 40px;
            padding: 24px;
            background: linear-gradient(135deg, rgba(39, 174, 96, 0.08) 0%, rgba(39, 174, 96, 0.02) 100%);
            border: 2px solid var(--success);
            border-radius: 8px;
        }
        body.dark-mode .wins-section {
            background: linear-gradient(135deg, rgba(39, 174, 96, 0.15) 0%, rgba(39, 174, 96, 0.05) 100%);
        }
        .wins-section h2 {
            font-size: 18px;
            color: var(--success);
            margin-bottom: 4px;
            font-weight: 700;
        }
        .wins-section p {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 16px;
        }
        .wins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 12px;
        }
        .win-item {
            background: var(--bg-secondary-light);
            padding: 12px 14px;
            border-radius: 6px;
            border-left: 4px solid var(--success);
            font-size: 13px;
        }
        body.dark-mode .win-item {
            background: var(--bg-secondary-dark);
        }
        .win-property {
            font-size: 11px;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .portfolio-section {
            margin-bottom: 36px;
        }
        .portfolio-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary-light);
        }
        .portfolio-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .item-count {
            background: var(--primary-light);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .task-card {
            background: var(--bg-secondary-light);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        body.dark-mode .task-card {
            background: var(--bg-secondary-dark);
            border-color: var(--border-dark);
        }
        .task-card:hover {
            border-color: var(--primary-light);
            box-shadow: 0 2px 8px rgba(74, 144, 226, 0.1);
        }
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }
        .task-description {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-light);
            line-height: 1.4;
            flex: 1;
        }
        body.dark-mode .task-description {
            color: var(--text-dark);
        }
        .task-description.stuck {
            color: var(--stuck-red);
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .status-badge.stuck {
            background: rgba(220, 38, 38, 0.15);
            color: var(--stuck-red);
        }
        .status-badge.pending {
            background: rgba(234, 179, 8, 0.15);
            color: #a16207;
        }
        .status-badge.inprogress {
            background: rgba(234, 88, 12, 0.15);
            color: #7c2d12;
        }
        .status-badge.new {
            background: rgba(37, 99, 235, 0.15);
            color: var(--new-blue);
        }
        .status-badge.approval {
            background: rgba(37, 99, 235, 0.15);
            color: var(--new-blue);
        }
        .task-meta {
            font-size: 12px;
            opacity: 0.6;
            margin-bottom: 10px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .task-actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
            flex-wrap: wrap;
            align-items: center;
        }
        body.dark-mode .task-actions {
            border-top-color: var(--border-dark);
        }
        .action-buttons {
            display: flex;
            gap: 6px;
        }
        .action-btn {
            padding: 6px 12px;
            border: 1.5px solid currentColor;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            background: transparent;
            text-transform: uppercase;
        }
        .action-btn.yes { color: var(--success); }
        .action-btn.yes.active { background: var(--success); color: white; }
        .action-btn.hold { color: var(--hold); }
        .action-btn.hold.active { background: var(--hold); color: white; }
        .action-btn.no { color: var(--reject); }
        .action-btn.no.active { background: var(--reject); color: white; }
        .notes-input {
            flex: 1;
            min-width: 200px;
            padding: 6px 10px;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            font-size: 12px;
            background: var(--bg-light);
            color: var(--text-light);
            font-family: inherit;
        }
        body.dark-mode .notes-input {
            background: var(--bg-secondary-dark);
            border-color: var(--border-dark);
            color: var(--text-dark);
        }
        .notes-input:focus {
            outline: none;
            border-color: var(--primary-light);
        }
        .final-comments {
            margin-top: 40px;
            padding: 24px;
            background: var(--bg-secondary-light);
            border: 1px solid var(--border-light);
            border-radius: 8px;
        }
        body.dark-mode .final-comments {
            background: var(--bg-secondary-dark);
            border-color: var(--border-dark);
        }
        .final-comments h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--primary-light);
        }
        .final-comments textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            background: var(--bg-light);
            color: var(--text-light);
            min-height: 100px;
        }
        body.dark-mode .final-comments textarea {
            background: var(--bg-dark);
            border-color: var(--border-dark);
            color: var(--text-dark);
        }
        .empty-state {
            padding: 20px;
            text-align: center;
            opacity: 0.5;
            font-size: 13px;
        }
        @media (max-width: 768px) {
            .header-left h1 { font-size: 24px; }
            .task-actions { flex-direction: column; }
            .notes-input { width: 100%; min-width: auto; }
            .wins-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>

        <div class="guidance">

        <!-- OPEN ITEMS BY PORTFOLIO -->

        <!-- FINAL COMMENTS -->
        <div class="final-comments">
            <h3>💬 Your Comments (Optional)</h3>
            <textarea id="finalComments" placeholder="Add any questions, notes, or follow-ups..."></textarea>

    </div>

        function init() {
            renderWins(data.wins);
            renderOpenItems(data.openItems);
            loadState();
        }

        function renderWins(wins) {
            const winsList = document.getElementById('winsList');
            winsList.innerHTML = '';
            let count = 0;
            Object.entries(wins).forEach(([portfolio, items]) => {
                items.forEach(win => {
                    count++;
                    const el = document.createElement('div');
                    el.className = 'win-item';
                    el.innerHTML = `<div class="win-property">${portfolio}</div><div>${win.description}</div>`;
                    winsList.appendChild(el);
                });
            });
            if (count === 0) {
                winsList.innerHTML = '<div class="empty-state">No wins logged yet this week</div>';
            }
        }

        function renderOpenItems(openItems) {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';

            Object.entries(openItems).forEach(([portfolio, tasks]) => {
                const section = document.createElement('div');
                section.className = 'portfolio-section';

                const header = document.createElement('div');
                header.className = 'portfolio-header';
                header.innerHTML = `<div class="portfolio-title">${portfolio}</div><div class="item-count">${tasks.length}</div>`;
                section.appendChild(header);

                tasks.forEach(task => {
                    const card = document.createElement('div');
                    card.className = 'task-card';

                    const descClass = task.status === 'Stuck' ? 'stuck' : '';
                    const statusClass = task.status.toLowerCase().replace(' ', '');

                    let cardHeader = `
                        <div class="task-header">
                            <div class="task-description ${descClass}">${task.description}</div>
                            <span class="status-badge ${statusClass}">${task.status}</span>
                        </div>
                    `;

                    let meta = '<div class="task-meta">';
                    if (task.deadline) meta += `📅 ${task.deadline}`;
                    meta += ` | 👤 ${task.assignment}</div>`;

                    card.innerHTML = cardHeader + meta;

                    // DALLAS APPROVAL ITEMS ONLY
                    if (task.isDallasApproval) {
                        const actions = document.createElement('div');
                        actions.className = 'task-actions';
                        actions.innerHTML = `
                            <div class="action-buttons">
                                <button class="action-btn yes" onclick="decide(${task.id}, 'yes', event)">✓ Yes</button>
                                <button class="action-btn hold" onclick="decide(${task.id}, 'hold', event)">⏸ Hold</button>
                                <button class="action-btn no" onclick="decide(${task.id}, 'no', event)">✗ No</button>
                            </div>
                            <input type="text" class="notes-input" placeholder="Add a note..." id="notes-${task.id}" onchange="saveNote(${task.id})">
                        `;
                        card.appendChild(actions);
                    }

                    section.appendChild(card);
                });

                container.appendChild(section);
            });
        }

        function decide(taskId, decision, event) {
            const buttons = document.querySelectorAll(`[onclick*="decide(${taskId},"]`);
            buttons.forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            state.decisions[taskId] = decision;
            localStorage.setItem('state', JSON.stringify(state));
        }

        function saveNote(taskId) {
            const input = document.getElementById(`notes-${taskId}`);
            state.notes[taskId] = input.value;
            localStorage.setItem('state', JSON.stringify(state));
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        }

        function loadState() {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
            }
            const saved = localStorage.getItem('state');
            if (saved) Object.assign(state, JSON.parse(saved));
        }

        function exportForEmail() {
            alert('Summary view coming soon!');
        }

        document.getElementById('finalComments').onchange = () => {
            state.finalComments = document.getElementById('finalComments').value;
            localStorage.setItem('state', JSON.stringify(state));
        };

        window.addEventListener('DOMContentLoaded', init);

</html>
